<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pienotes - Notes App Using MathQuill</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="stylesheet" href="mathquill.css"/>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="mathquill.js"></script>
    <script src="mathquill.min.js"></script>
</head>

<body>

    <aside id="sidebar">
        <div id="sidebar-header">
            <h2 style="color: white; margin-bottom: 10px;">Pienotes</h2>
            <div style="display:flex; gap: 5px;">
                <button id="new-note-btn" class="btn">+ New Note</button>
            </div>
            <div class="sidebar-actions">
                <button class="btn" onclick="exportNotes()">Export All</button>
                <button class="btn" onclick="document.getElementById('import-input').click()">Import</button>
                <input type="file" id="import-input" accept=".json" onchange="importNotes(event)">
            </div>
            <div style="margin-top: 8px;">
                <p>Ctrl + E = convert to MathQuill</p>
                <p>Shift + Enter = new text block</p>
                <a href="https://quickref.me/latex.html" target="_blank">LaTeX Cheat Sheet</a>
            </div>
        </div>
        <ul id="note-list"></ul>
    </aside>

    <main id="main-content">
        <div class="header-container">
            <button id="toggle-sidebar-btn" title="Toggle Sidebar">☰</button>
            <input type="text" id="note-title" placeholder="Enter Note Title...">
            <button id="toggle-desmos-btn" title="Toggle Calculator">☰</button>
        </div>

        <div id="editor-container"></div>
    </main>

    <aside id="desmos-container">
        <div id="desmos-resizer" title="Drag to resize"></div>
        <div id="desmos-header">
            <span>Desmos Calculator</span>
        </div>
        <iframe src="https://www.desmos.com/scientific"></iframe>
    </aside>

    <script>
        // State Management
        let notes = JSON.parse(localStorage.getItem('math_notes')) || [
            {
                id: Date.now(),
                title: 'Welcome Note',
                blocks: [
                      {
                        "id": "b1790106053396",
                        "type": "text",
                        "value": "<b>Welcome to Pienotes!</b>"
                      },
                      {
                        "id": "b1790106391514",
                        "type": "text",
                        "value": ""
                      },
                      {
                        "id": "b1790106062778",
                        "type": "text",
                        "value": "Use <i>Ctrl + E</i> to create a <b>math block</b>."
                      },
                      {
                        "id": "b1790106104290",
                        "type": "text",
                        "value": "Use <i>Shift + Enter</i> to create a new <b>text block</b>."
                      },
                      {
                        "id": "b1790106251569",
                        "type": "text",
                        "value": ""
                      },
                      {
                        "id": "b1790106251700",
                        "type": "text",
                        "value": "Inside a <b>math block</b>, use auto commands such as <i>sqrt</i>, <i>int</i>, <i>rArr</i> and many more to automatically convert strings into symbols."
                      },
                      {
                        "id": "b1790106458932",
                        "type": "text",
                        "value": "Alternatively, type \"\\\" followed by a LaTeX command. A link to a LaTeX cheat sheet can be found on the left."
                      },
                      {
                        "id": "b1790106480056",
                        "type": "text",
                        "value": ""
                      },
                      {
                        "id": "b1790106498932",
                        "type": "text",
                        "value": "Type \"text\" to write plain text inside math blocks."
                      },
                      {
                        "id": "b1790106480056",
                        "type": "text",
                        "value": ""
                      },
                      {
                        "id": "b1790106320511",
                        "type": "text",
                        "value": "Inside a <b>text block</b>, you can use <i>Ctrl + B</i>, <i>Ctrl + I</i>, <i>Ctrl + U</i> and <i>Ctrl + Shift + S</i> to format your text."
                      }
                ]
            }
        ];
        let activeNoteId = notes.length > 0 ? notes[0].id : null;

        const MQ = MathQuill.getInterface(2);
        const noteListEl = document.getElementById('note-list');
        const titleInput = document.getElementById('note-title');
        const editorContainer = document.getElementById('editor-container');
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar-btn');
        const desmosContainer = document.getElementById('desmos-container');
        const desmosResizer = document.getElementById('desmos-resizer');
        const toggleDesmosBtn = document.getElementById('toggle-desmos-btn');

        // --- Sidebar & Desmos Toggles ---
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });

        toggleDesmosBtn.addEventListener('click', () => {
            desmosContainer.classList.toggle('collapsed');
        });

        // --- Desmos Panel Resizing (Mouse & Touch) ---
        let isResizing = false;
        let startX = 0;
        let startWidth = 0;

        function startResize(e) {
            e.preventDefault(); // Prevents native drag-and-drop behavior
            isResizing = true;
            startX = e.clientX;
            startWidth = desmosContainer.getBoundingClientRect().width;

            document.body.classList.add('is-resizing');
            desmosContainer.style.transition = 'none';

            if (e.pointerId !== undefined) {
                desmosResizer.setPointerCapture(e.pointerId);
            }

            window.addEventListener('pointermove', doResize);
            window.addEventListener('pointerup', stopResize);
            window.addEventListener('pointercancel', stopResize);
        }

        function doResize(e) {
            if (!isResizing) return;
            e.preventDefault();

            const currentX = e.clientX;
            const deltaX = startX - currentX; // Dragging left increases width
            let newWidth = startWidth + deltaX;

            // Constrain width (min 200px, max 85% of screen width)
            const minWidth = 200;
            const maxWidth = Math.min(window.innerWidth - 80, window.innerWidth * 0.85);

            if (newWidth < minWidth) newWidth = minWidth;
            if (newWidth > maxWidth) newWidth = maxWidth;

            desmosContainer.style.setProperty('--desmos-width', `${newWidth}px`);
        }

        function stopResize(e) {
            if (!isResizing) return;
            isResizing = false;
            document.body.classList.remove('is-resizing');
            desmosContainer.style.transition = 'margin-right 0.3s ease';

            if (e && e.pointerId !== undefined && desmosResizer.hasPointerCapture(e.pointerId)) {
                desmosResizer.releasePointerCapture(e.pointerId);
            }

            window.removeEventListener('pointermove', doResize);
            window.removeEventListener('pointerup', stopResize);
            window.removeEventListener('pointercancel', stopResize);
        }

        desmosResizer.addEventListener('pointerdown', startResize);
        desmosResizer.addEventListener('dragstart', (e) => e.preventDefault());

        // --- Persistence ---
        function saveToDisk() {
            localStorage.setItem('math_notes', JSON.stringify(notes));
        }

        // --- Export/Import ---
        function exportNotes() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "pienotes_export.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importNotes(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        const newNotes = [];

                        imported.forEach(importedNote => {
                            const existingIndex = notes.findIndex(n => n.title === importedNote.title);

                            if (existingIndex !== -1) {
                                importedNote.id = notes[existingIndex].id;
                                notes[existingIndex] = importedNote;
                            } else {
                                const idExists = notes.some(n => n.id === importedNote.id);
                                if (idExists) {
                                    importedNote.id = Date.now() + Math.floor(Math.random() * 1000);
                                }
                                newNotes.push(importedNote);
                            }
                        });

                        if (newNotes.length > 0) {
                            notes.unshift(...newNotes);
                        }

                        saveToDisk();

                        if (newNotes.length > 0) {
                            loadNote(newNotes[0].id);
                        } else if (activeNoteId && notes.find(n => n.id === activeNoteId)) {
                            loadNote(activeNoteId);
                        } else if (notes.length > 0) {
                            loadNote(notes[0].id);
                        }

                        renderSidebar();
                    }
                } catch (err) {
                    alert("Invalid JSON file");
                }

                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // --- Sidebar & Note Management ---
        function renderSidebar() {
            noteListEl.innerHTML = '';
            notes.forEach(note => {
                const li = document.createElement('li');
                li.className = `note-item ${note.id === activeNoteId ? 'active' : ''}`;
                li.innerHTML = `
                    <span class="note-name">${note.title || 'Untitled'}</span>
                    <button class="delete-note-btn" onclick="deleteNote(event, ${note.id})">&times;</button>
                `;
                li.onclick = () => loadNote(note.id);
                noteListEl.appendChild(li);
            });
        }

        function deleteNote(e, id) {
            e.stopPropagation();
            if (!confirm("Delete this note?")) return;
            notes = notes.filter(n => n.id !== id);
            saveToDisk();
            if (activeNoteId === id) {
                activeNoteId = notes.length > 0 ? notes[0].id : null;
            }
            renderSidebar();
            if (activeNoteId) loadNote(activeNoteId);
            else {
                editorContainer.innerHTML = '';
                titleInput.value = '';
            }
        }

        function loadNote(id) {
            activeNoteId = id;
            const note = notes.find(n => n.id === id);
            if (!note) return;
            titleInput.value = note.title;
            renderSidebar();
            renderEditor();
        }

        function createNewNote() {
            const newId = Date.now();
            notes.unshift({
                id: newId,
                title: 'New Note',
                blocks: [{ id: 'b' + Date.now(), type: 'text', value: '' }]
            });
            saveToDisk();
            loadNote(newId);
            titleInput.focus();
        }

        // --- Editor Core ---
        function renderEditor() {
            editorContainer.innerHTML = '';
            const note = notes.find(n => n.id === activeNoteId);
            if (!note) return;

            note.blocks.forEach(blockData => {
                const el = blockData.type === 'text' ? createTextDOM(blockData) : createMathDOM(blockData);
                editorContainer.appendChild(el);
            });
        }

        function createTextDOM(blockData) {
            const div = document.createElement('div');
            div.className = 'block text-block';
            div.contentEditable = true;

            div.innerHTML = blockData.value;
            div.dataset.id = blockData.id;

            div.oninput = () => { blockData.value = div.innerHTML; saveToDisk(); };

            return div;
        }

        function createMathDOM(blockData) {
            const div = document.createElement('div');
            div.className = 'block math-block';
            div.dataset.id = blockData.id;
            const span = document.createElement('span');
            span.textContent = blockData.value;
            div.appendChild(span);

            const mf = MQ.MathField(span, {
                autoCommands: 'pi theta alpha beta gamma delta epsilon lambda infinity reals ' +
                                'neq approx ' +
                                'times div ast ' +
                                'sqrt nthroot sum int prod binom ' +
                                'parallel smile frown star ' +
                                'rarr rArr larr uarr darr rightarrow leftarrow uparrow downarrow overrightarrow overline underline vec implies ' +
                                'text',
                autoOperatorNames: 'sin cos tan log ln dot dotP cross crossP solve zeros lim max min binompdf binomcdf',
                supSubsRequireOperand: true,
                handlers: {
                    edit: () => { blockData.value = mf.latex(); saveToDisk(); },
                    upOutOf: () => focusPrevBlock(div),
                    downOutOf: () => focusNextBlock(div)
                }
            });
            div.mathField = mf;
            return div;
        }

        // --- Helpers ---
        function focusBlock(blockEl) {
            if (!blockEl) return;

            lastFocusedBlockId = blockEl.dataset.id;

            if (blockEl.classList.contains('text-block')) {
                blockEl.focus();
            } else if (blockEl.mathField) {
                blockEl.mathField.focus();
            }
        }

        function focusPrevBlock(el) { focusBlock(el.previousElementSibling); }
        function focusNextBlock(el) { focusBlock(el.nextElementSibling); }

        function insertBlock(currentEl, type) {
            const note = notes.find(n => n.id === activeNoteId);
            const idx = note.blocks.findIndex(b => b.id == currentEl.dataset.id);
            const newBlock = { id: 'b' + Date.now(), type: type, value: '' };
            note.blocks.splice(idx + 1, 0, newBlock);
            saveToDisk();
            renderEditor();

            setTimeout(() => {
                const newEl = document.querySelector(`[data-id="${newBlock.id}"]`);
                focusBlock(newEl);
                if (newEl) {
                    newEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 10);
        }

        // --- Global Listeners ---
        titleInput.oninput = () => {
            const note = notes.find(n => n.id === activeNoteId);
            if (note) {
                note.title = titleInput.value;
                saveToDisk();
                renderSidebar();
            }
        };

        document.getElementById('new-note-btn').onclick = createNewNote;

        editorContainer.addEventListener('keydown', (e) => {
            const blockEl = e.target.closest('.block');
            if (!blockEl) return;

            if (blockEl.classList.contains('text-block')) {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    focusPrevBlock(blockEl);
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    focusNextBlock(blockEl);
                }
                if (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')) {
                    e.preventDefault();
                    document.execCommand('strikeThrough', false, null);
                    blockEl.dispatchEvent(new Event('input'));
                }
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                const type = (blockEl.classList.contains('math-block') && !e.shiftKey) ? 'math' : 'text';
                insertBlock(blockEl, type);
            }

            if (e.ctrlKey && e.key === 'e') {
                e.preventDefault();
                const note = notes.find(n => n.id === activeNoteId);
                const block = note.blocks.find(b => b.id == blockEl.dataset.id);
                if (block.type === 'text' && (block.value === '' || block.value === '\n')) {
                    block.type = 'math';
                    renderEditor();
                    setTimeout(() => {
                        const convertedEl = document.querySelector(`[data-id="${block.id}"]`);
                        focusBlock(convertedEl);
                        if (convertedEl) {
                            convertedEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }, 10);
                } else {
                    insertBlock(blockEl, 'math');
                }
            }

            if (e.key === 'Backspace') {
                const note = notes.find(n => n.id === activeNoteId);
                const blockData = note.blocks.find(b => b.id == blockEl.dataset.id);

                let isBlockEmpty = false;
                if (blockEl.classList.contains('math-block')) {
                    isBlockEmpty = blockEl.mathField.latex() === '';
                } else {
                    isBlockEmpty = blockEl.textContent === '';
                }

                if (isBlockEmpty && note.blocks.length > 1) {
                    e.preventDefault();
                    const prev = blockEl.previousElementSibling;
                    note.blocks = note.blocks.filter(b => b.id != blockData.id);
                    saveToDisk();
                    renderEditor();
                    if (prev) focusBlock(document.querySelector(`[data-id="${prev.dataset.id}"]`));
                }
            }
        });

        // Initial Load
        renderSidebar();
        if (activeNoteId) loadNote(activeNoteId);

    </script>
</body>

</html>
